name: Kalenterin tarkistus

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aja tarkistusskripti
        env:
          DISCORD_WEBHOOK_AIKATAULU: ${{ secrets.DISCORD_WEBHOOK_AIKATAULU }}
          DISCORD_WEBHOOK_ANNOUNCE: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCE }}
        run: node check.js
